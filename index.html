let db = null, auth = null, userId = null, isCloudReady = false;

async function initCloud() {
    try {
        // Firebase is loaded dynamically so a cloud/CDN problem can never block the game UI.
        const [fbApp, fbAuth, fbStore] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]);
        initializeApp = fbApp.initializeApp;
        getAuth = fbAuth.getAuth;
        signInAnonymously = fbAuth.signInAnonymously;
        getFirestore = fbStore.getFirestore;
        doc = fbStore.doc;
        getDoc = fbStore.getDoc;
        setDoc = fbStore.setDoc;
        collection = fbStore.collection;
        getDocs = fbStore.getDocs;

        const appInfo = initializeApp(firebaseConfig);
        auth = getAuth(appInfo);
        db = getFirestore(appInfo);

        // Cloud is optional: the game must never wait for Firebase.
        const signInResult = await Promise.race([
            signInAnonymously(auth),
            new Promise((_, reject) => setTimeout(() => reject(new Error('cloud-timeout')), 4500))
        ]);
        userId = auth.currentUser && auth.currentUser.uid;
        if (!userId) throw new Error('no-user');

        const snap = await Promise.race([
            getDoc(doc(db, 'artifacts', appId, 'users', userId)),
            new Promise((_, reject) => setTimeout(() => reject(new Error('cloud-timeout')), 4500))
        ]);

        // Do not replace an active run with late cloud data.
        if (snap.exists() && app === 'MENU') {
            Object.assign(save, snap.data());
            migrateMeters();
            updateTexts();
        }

        isCloudReady = true;
        $('lt').textContent = 'Cloud connected';
    } catch(e) {
        console.error("Cloud init failed", e);
        $('lt').textContent = e && e.message === 'cloud-timeout'
            ? 'Offline mode'
            : 'Cloud unavailable';
    }
}

let persistTimer = null;
function persist() {
    if (!db || !userId) return;
    if (persistTimer) clearTimeout(persistTimer);
    persistTimer = setTimeout(async () => {
        try {
            await setDoc(doc(db, 'artifacts', appId, 'users', userId), save);
            if (save.name && save.best > 0) {
                // Update global leaderboard
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', userId), {
                    name: save.name,
                    best: save.best,
                    coins: save.coins,
                    skin: save.skin
                });
            }
        } catch(e) { console.error("Save error", e); }
    }, 1500);
}

async function showLeaderboard() {
    AU.click();
    show('menu', 0);
    show('ldr-ui', 1);
    const ldrList = $('ldr-list');
    ldrList.innerHTML = '<div style="text-align:center;padding:20px;">Loading...</div>';
    
    if (!db) {
        ldrList.innerHTML = `<div style="text-align:center;padding:20px;">Cloud unavailable</div>`;
        return;
    }
    
    try {
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
        const snap = await getDocs(colRef);
        let players = [];
        snap.forEach(d => players.push(d.data()));
        players.sort((a, b) => b.best - a.best);
        players = players.slice(0, 15);
        
        ldrList.innerHTML = '';
        if (players.length === 0) {
            ldrList.innerHTML = `<div style="text-align:center;padding:20px;">${T('no_rec')}</div>`;
            return;
        }
        
        players.forEach((p, i) => {
            const isMe = p.name === save.name;
            const r = document.createElement('div');
            r.className = 'lb-row' + (isMe ? ' me' : '');
            const badge = p.skin && AB[p.skin] ? AB[p.skin].i : '';
            r.innerHTML = `<span>${i + 1}. ${p.name} ${badge}</span><span>${p.best}m</span>`;
            ldrList.appendChild(r);
        });
    } catch(e) {
        ldrList.innerHTML = `<div style="text-align:center;padding:20px;">Failed to load.</div>`;
    }
}
